\* As Drain_sweep, but no drain starts until the sweep is done.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Mutators = {t1}
    Drainers = {t2, t3}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "claim"
    ForkMode = "idle"
    HoldDrains = TRUE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = FALSE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble NoLoss Clean
ALIAS Alias
CHECK_DEADLOCK FALSE
