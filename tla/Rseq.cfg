\* The design: stopped sequences restart, running threads have distinct cids.
\* Two threads, magazines of two objects.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCids = 2
    NMags = 2
    NObjs = 3
    Slots = 4
    Restart = TRUE
    Exclusive = TRUE
    BadCid = FALSE
SYMMETRY Symm
INVARIANTS CidsDistinct InRange SlabInvariant Conservation
CHECK_DEADLOCK FALSE
