\* As built, three bits to a word: a batch of two held words under a summary
\* word that has a third, so the batch's AND can leave the summary word
\* non-empty without any bit having been set back.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    B = 3
    Top = 1
    Reread = TRUE
    Heal = TRUE
    Crash = FALSE
    Run = TRUE
    Keep = FALSE
    Look = FALSE
SYMMETRY Symm
INVARIANTS Partition Visible
CHECK_DEADLOCK FALSE
