\* An object that straddles two pages (a class size that does not divide the page size).
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Layout = "straddle"
    W = 2
    ClaimRule = "overlap"
    ZeroRule = "inside"
    ZeroOrder = "before"
SYMMETRY Symm
INVARIANTS Partition PurgeSafe ZeroBitSound ZeroedIsZero NoFalseDoubleFree
CHECK_DEADLOCK FALSE
