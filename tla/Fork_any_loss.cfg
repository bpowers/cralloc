\* Repair by sweep, which the design rejected, fork at any step: the sweep can make the forking thread drop a magazine.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Cids = {c1, c2}
    Mags = {m1, m2}
    Objs = {o1, o2, o3}
    Cap = 2
    Repair = "sweep"
    Heal = FALSE
    ForkMode = "any"
SYMMETRY Symm
INVARIANTS NoLoss
CHECK_DEADLOCK FALSE
