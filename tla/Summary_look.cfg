\* A free whose OR found its word empty reads the summary bit before setting it
\* (Look), with the healing free and runs of claims as built.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    B = 2
    Top = 1
    Reread = TRUE
    Heal = TRUE
    Crash = FALSE
    Run = TRUE
    Keep = FALSE
    Look = TRUE
SYMMETRY Symm
INVARIANTS Partition Visible
CHECK_DEADLOCK FALSE
