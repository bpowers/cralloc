\* Set the zero bit of every claimed object, including ones only partly purged.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Layout = "straddle"
    W = 2
    ClaimRule = "overlap"
    ZeroRule = "claimed"
    ZeroOrder = "before"
SYMMETRY Symm
INVARIANTS Partition PurgeSafe ZeroBitSound ZeroedIsZero NoFalseDoubleFree
CHECK_DEADLOCK FALSE
