\* As Drain_sweep_hold, but the forking thread may be inside the allocator.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Mutators = {t1}
    Drainers = {t2, t3}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "claim"
    ForkMode = "any"
    HoldDrains = TRUE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = FALSE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble
ALIAS Alias
CHECK_DEADLOCK FALSE
