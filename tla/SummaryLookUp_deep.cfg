\* A free that looks at every level, on a tree whose claims keep their bits and
\* whose other frees do not look, two summary levels.
SPECIFICATION SpecAny
CONSTANTS
    Threads = {t1, t2}
    B = 2
    Top = 2
    Reread = TRUE
    Heal = TRUE
    Crash = FALSE
    Run = TRUE
    Keep = TRUE
    Look = TRUE
SYMMETRY Symm
INVARIANTS Partition Visible
CHECK_DEADLOCK FALSE
