\* The current design: two threads allocating, one draining; membarrier may fail.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Mutators = {t1, t2}
    Drainers = {t3}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "claim"
    ForkMode = "none"
    HoldDrains = FALSE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = TRUE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble NoLoss Clean
ALIAS Alias
CHECK_DEADLOCK FALSE
