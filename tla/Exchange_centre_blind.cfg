\* Exchange.cfg with a centring that installs over whatever the slab word holds
\* instead of expecting the Zero its take left: a call that ran meanwhile
\* installed its own magazine, and the store loses it.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Cids = {c1, c2}
    Mags = {m1, m2, m3}
    Objs = {o1, o2, o3}
    Cap = 2
    MaxDepth = 2
    SpareMax = 1
    BadCid = TRUE
    BlindCentre = TRUE
SYMMETRY Symm
INVARIANTS OneOwner Usable NoWait
CHECK_DEADLOCK FALSE
