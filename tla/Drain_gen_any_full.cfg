\* Generations; the forking thread may be inside the allocator: nothing is duplicated. Two threads, each in any role. Slow: run with SLOW=1.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Mutators = {t1, t2}
    Drainers = {t1, t2}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "gen"
    ForkMode = "any"
    HoldDrains = FALSE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = FALSE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble
ALIAS Alias
CHECK_DEADLOCK FALSE
