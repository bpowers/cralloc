\* The fix (StaleAhead = FALSE): a stamp ahead of the reader's interval is fresh. The review
\* ran the code as it was (TRUE). Three threads, so that one can take the bit with the first
\* owner's stamp after a thread with an older reading took it over; two units and two
\* intervals keep it small.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Units = 2
    Repair = TRUE
    MaxEpoch = 2
    ForkRepair = TRUE
    StaleAhead = FALSE
INVARIANTS TypeOK Agree OffOnlyReturned
CHECK_DEADLOCK FALSE
