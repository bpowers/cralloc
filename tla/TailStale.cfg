\* Review: three threads, so that one can take the bit with the first owner's
\* stamp after a thread with an older reading took it over; two units and two
\* intervals keep it small.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Units = 2
    Repair = TRUE
    MaxEpoch = 2
    ForkRepair = TRUE
INVARIANTS TypeOK Agree OffOnlyReturned
CHECK_DEADLOCK FALSE
