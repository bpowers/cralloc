\* Generations instead of a sweep; fork from outside the allocator. Two threads, each in any role.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Mutators = {t1, t2}
    Drainers = {t1, t2}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "gen"
    ForkMode = "idle"
    HoldDrains = FALSE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = TRUE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble NoLoss Clean
ALIAS Alias
CHECK_DEADLOCK FALSE
