\* Two threads, each with a signal handler that may allocate or free, two
\* cids, an out-of-range cid, and a drainer.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Cids = {c1, c2}
    Mags = {m1, m2, m3}
    Objs = {o1, o2, o3}
    Cap = 2
    MaxDepth = 2
    SpareMax = 1
    BadCid = TRUE
SYMMETRY Symm
INVARIANTS OneOwner Usable NoWait
CHECK_DEADLOCK FALSE
