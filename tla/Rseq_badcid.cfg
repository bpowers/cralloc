\* A thread may be handed an out-of-range cid, which any number of threads
\* may hold at once. Magazines of one object keep the state space small.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    NCids = 2
    NMags = 2
    NObjs = 2
    Slots = 3
    Restart = TRUE
    Exclusive = TRUE
    BadCid = TRUE
SYMMETRY Symm
INVARIANTS CidsDistinct InRange SlabInvariant Conservation
CHECK_DEADLOCK FALSE
