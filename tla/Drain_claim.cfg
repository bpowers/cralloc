\* The drain with no fork: one thread allocating and freeing, two draining.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Mutators = {t1}
    Drainers = {t2, t3}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "claim"
    ForkMode = "none"
    HoldDrains = FALSE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = FALSE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoDouble NoLoss Clean
ALIAS Alias
CHECK_DEADLOCK FALSE
