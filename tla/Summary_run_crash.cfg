    Threads = {t1, t2, t3}
    B = 2
    Top = 1
    Reread = TRUE
    Heal = TRUE
    Crash = TRUE
    Run = TRUE
    Keep = FALSE
    Look = FALSE
SYMMETRY Symm
INVARIANTS Partition Healed
CHECK_DEADLOCK FALSE
