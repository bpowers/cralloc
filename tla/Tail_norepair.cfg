\* Without the repair bit, an owner taken over while still alive makes its call
\* after the new owner's, and the kernel's advice stays different from the word.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Units = 3
    Repair = FALSE
    MaxEpoch = 3
    ForkRepair = TRUE
INVARIANTS TypeOK Agree OffOnlyReturned
CHECK_DEADLOCK FALSE
