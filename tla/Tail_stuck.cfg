\* Without the child clearing the owner bit: a fork leaves an owner behind holding a marked
\* region, and the mark is never answered (no looker can take the bit before it goes stale,
\* and nothing makes a looker look again).
SPECIFICATION LiveSpec
CONSTANTS
    Threads = {t1, t2}
    Units = 2
    Repair = TRUE
    MaxEpoch = 0
    ForkRepair = TRUE
    ChildClears = FALSE
    Lowerings = 2
INVARIANTS TypeOK Agree OffOnlyReturned
PROPERTIES Answered
CHECK_DEADLOCK FALSE
