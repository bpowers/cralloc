\* Two threads assign for class c1 (one loses and gives its region back), one for c2, and a
\* run can take a region given back; the scanner reads the published tag.
SPECIFICATION Spec
CONSTANTS
    Regions = {r1, r2}
    Assigners = {t1, t2, t3}
    Second = t3
    Repair = "none"
    ReadsTable = FALSE
INVARIANTS TypeOK Safe NotAnothers Published Kept
CHECK_DEADLOCK FALSE
