\* Liveness of the marks: every mark is answered, under weak fairness of the live threads'
\* steps. Smaller than Tail.cfg: TLC's liveness check is far slower than its invariants.
SPECIFICATION LiveSpec
CONSTANTS
    Threads = {t1, t2}
    Units = 2
    Repair = TRUE
    MaxEpoch = 2
    ForkRepair = TRUE
    ChildClears = TRUE
    RetryTake = TRUE
    Lowerings = 2
INVARIANTS TypeOK Agree OffOnlyReturned MarkVisible
PROPERTIES Answered
CHECK_DEADLOCK FALSE
