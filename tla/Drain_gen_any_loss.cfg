\* Generations; the forking thread may be inside the allocator. Shows the leak.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    Mutators = {t1}
    Drainers = {t2, t3}
    NCids = 2
    NMags = 2
    Cap = 1
    Protocol = "gen"
    ForkMode = "any"
    HoldDrains = FALSE
    ZeroOnlyIfMag = FALSE
    FenceCanFail = FALSE
    InPlace = FALSE
SYMMETRY Symm
INVARIANTS NoLoss
ALIAS Alias
CHECK_DEADLOCK FALSE
