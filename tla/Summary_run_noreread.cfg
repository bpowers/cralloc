    Threads = {t1, t2}
    B = 2
    Top = 1
    Reread = FALSE
    Heal = TRUE
    Crash = FALSE
    Run = TRUE
    Keep = FALSE
SYMMETRY Symm
INVARIANTS Partition Visible
CHECK_DEADLOCK FALSE
