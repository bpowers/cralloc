\* Three threads on two cids, so some thread is always stopped. Magazines of
\* one object keep the state space small.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2, t3}
    NCids = 2
    NMags = 3
    NObjs = 2
    Slots = 3
    Restart = TRUE
    Exclusive = TRUE
    BadCid = FALSE
SYMMETRY Symm
INVARIANTS CidsDistinct InRange SlabInvariant Conservation
CHECK_DEADLOCK FALSE
