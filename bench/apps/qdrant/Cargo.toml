# Qdrant, the vector search engine, serving searches over a collection it holds in memory while
# points are upserted, as a server driven by the suite's load generator. See ../README.md and
# src/main.rs.
[workspace]
resolver = "3"

# Named and versioned as Qdrant's own package, whose `main` this binary compiles (build.rs):
# its code reads both (telemetry, the greeting).
[package]
name = "qdrant"
version = "1.20.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "qdrant"
path = "src/main.rs"

# The allocator under test, by the bench-alloc feature of its entry in ../../allocators.toml
# (none: glibc). Every program forwards the same set; see ../README.md. Qdrant's own features
# follow, as its manifest declares them, so that its code's `cfg(feature)` reads as it does
# there; none is on.
[features]
mi = ["bench-alloc/mi"]
mi-sized = ["bench-alloc/mi-sized"]
mi-crate = ["bench-alloc/mi-crate"]
asmalloc = ["bench-alloc/asmalloc"]
je = ["bench-alloc/je"]
tc = ["bench-alloc/tc"]
sn = ["bench-alloc/sn"]
# Not an allocator: the live-bytes count, for resident over live (../../alloc/src/live.rs).
live-bytes = ["bench-alloc/live-bytes"]
default = []
service_debug = ["parking_lot/deadlock_detection", "collection/testing"]
tracing = ["api/tracing", "collection/tracing", "segment/tracing", "storage/tracing"]
console = ["console-subscriber"]
console-subscriber = ["tracing", "dep:console-subscriber"]
tracy = ["tracing-tracy"]
tracing-tracy = ["tracing", "dep:tracing-tracy"]
tokio-tracing = ["tokio/tracing"]
dial9 = ["storage/dial9"]
stacktrace = ["rstack-self"]
chaos-testing = []
data-consistency-check = ["collection/data-consistency-check"]
gpu = ["gpu/gpu", "segment/gpu"]
deb = []
staging = ["collection/staging", "storage/staging", "shard/staging"]

[dependencies]
bench-alloc = { path = "../../alloc" }
bench-app = { path = "../common" }
libc = "0.2"
# Qdrant's binary's dependencies at 1.20.0 (its manifest, with the workspace's versions and
# features written out, and its own crates from its repository at the release's commit), but
# for tikv-jemallocator, which only its global allocator line uses.
parking_lot = { version = "0.12.5", features = ["arc_lock", "deadlock_detection", "serde"] }
fs-err = { version = "3.3.0", features = ["tokio"] }
thiserror = { version = "2.0.18" }
log = { version = "0.4.31" }
colored = { version = "3" }
serde = { version = "~1.0", features = ["derive", "rc"] }
serde_json = { version = "~1.0", features = ["preserve_order"] }
serde_with = { version = "3.22.0", default-features = false, features = ["macros", "alloc"] }
chrono = { version = "0.4.44", features = ["serde"] }
rand = { version = "0.10.1" }
schemars = { version = "0.8.22", features = ["uuid1", "preserve_order", "chrono", "url", "indexmap2"] }
itertools = { version = "0.15.0" }
anyhow = { version = "1.0.98" }
futures = { version = "0.3.32" }
futures-util = { version = "0.3.32" }
clap = { version = "4.6.1", features = ["derive", "env"] }
ctrlc = { version = "3.5.2" }
env_logger = { version = "0.11" }
serde_cbor = { version = "0.11.2" }
uuid = { version = "1.23", features = ["v4", "serde"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
ordered-float = { version = "5.3.0", features = ["serde", "schemars", "bytemuck"] }
ahash = { version = "0.8.12", features = ["serde"] }
urlencoding = { version = "2.1.3" }
config = { version = "0.15.22", default-features = false, features = ["yaml"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
actix-cors = { version = "0.7.1" }
actix-web-validator = { version = "7.0.0" }
actix-web = { version = "4.13.0", features = ["rustls-0_23", "actix-tls"] }
actix-files = { version = "0.7.0" }
tonic = { version = "0.14.6", features = ["gzip", "tls-ring"] }
tonic-reflection = { version = "0.14.6" }
tower = { version = "0.5.3", features = ["util"] }
tower-layer = { version = "0.3.3" }
http = { version = "1.4.1" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2", "stream", "rustls", "blocking"] }
rustls = { version = "0.23.37", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pki-types = { version = "1.14.0" }
rustls-pemfile = { version = "2.2.0" }
prometheus = { version = "0.14.0", default-features = false }
validator = { version = "0.20.0", features = ["derive"] }
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
tempfile = { version = "3.27.0" }
raft = { git = "https://github.com/tikv/raft-rs", rev = "aafb07c7bab439c6139926a77dfafc5b10e9bc84", default-features = false, features = ["prost-codec"] }
slog = { version = "2.8.2", features = ["max_level_trace", "release_max_level_debug"] }
slog-stdlog = { version = "4.1.1" }
prost-for-raft = { package = "prost", version = "=0.11.9" }
raft-proto = { git = "https://github.com/tikv/raft-rs", rev = "aafb07c7bab439c6139926a77dfafc5b10e9bc84", default-features = false, features = ["prost-codec"] }
common = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
cancel = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
issues = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
segment = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7", default-features = false }
shard = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7", default-features = false }
collection = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
storage = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
api = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
bm25 = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
gpu = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
wal = { git = "https://github.com/qdrant/qdrant", rev = "222b2e44ab1c3f17e8246396ead6558e45041df7" }
actix-multipart = { version = "0.8.0" }
constant_time_eq = { version = "0.6.0" }
tracing = { version = "0.1", features = ["async-await"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
console-subscriber = { version = "0.5.0", default-features = false, features = ["parking_lot"], optional = true }
tracing-tracy = { version = "0.12.0", features = ["ondemand"], optional = true }
actix-web-extras = { version = "0.1.0" }
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", default-features = false }
pyroscope = { version = "2.1.0", features = ["backend-pprof-rs", "backend-jemalloc"] }
rstack-self = { version = "0.3.0", optional = true }

# As Qdrant's workspace declares it, for its code's `cfg(tokio_unstable)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[patch.crates-io]
# Qdrant's own patch, from its workspace manifest.
tonic = { git = "https://github.com/qdrant/tonic", branch = "v0.14.6-qdrant" }
tikv-jemalloc-sys = { path = "no-jemalloc-sys" }

# Qdrant's release profile at 1.20.0 (its workspace manifest).
[profile.release]
lto = "fat"
codegen-units = 1
