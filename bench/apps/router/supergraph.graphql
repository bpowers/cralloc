schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION) {
  query: Query
}

# The supergraph of the four subgraphs in subgraphs/ (their SDL is `{ _service { sdl } }` of
# each): Apollo's federation demo, with a product description, a review rating and an offset
# for topProducts. Written in the form composition gives (join v0.3); the subgraph URLs are
# replaced by the Router's configuration (`override_subgraph_url`), which the driver writes.

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(
  graph: join__Graph!
  interface: String!
) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(
  graph: join__Graph!
  member: String!
) repeatable on UNION

directive @link(
  url: String
  as: String
  for: link__Purpose
  import: [link__Import]
) repeatable on SCHEMA

scalar join__FieldSet

enum join__Graph {
  ACCOUNTS @join__graph(name: "accounts", url: "http://accounts.invalid/")
  INVENTORY @join__graph(name: "inventory", url: "http://inventory.invalid/")
  PRODUCTS @join__graph(name: "products", url: "http://products.invalid/")
  REVIEWS @join__graph(name: "reviews", url: "http://reviews.invalid/")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Product
  @join__type(graph: ACCOUNTS, key: "upc")
  @join__type(graph: INVENTORY, key: "upc")
  @join__type(graph: PRODUCTS, key: "upc")
  @join__type(graph: REVIEWS, key: "upc") {
  upc: String!
  name: String! @join__field(graph: PRODUCTS)
  price: Int!
    @join__field(graph: INVENTORY, external: true)
    @join__field(graph: PRODUCTS)
  weight: Int!
    @join__field(graph: INVENTORY, external: true)
    @join__field(graph: PRODUCTS)
  description: String! @join__field(graph: PRODUCTS)
  inStock: Boolean! @join__field(graph: INVENTORY)
  shippingEstimate: Int
    @join__field(graph: INVENTORY, requires: "price weight")
  reviews: [Review!]! @join__field(graph: REVIEWS)
}

type Query
  @join__type(graph: ACCOUNTS)
  @join__type(graph: INVENTORY)
  @join__type(graph: PRODUCTS)
  @join__type(graph: REVIEWS) {
  me: User! @join__field(graph: ACCOUNTS)
  recommendedProducts: [Product!]! @join__field(graph: ACCOUNTS)
  topProducts(first: Int! = 5, offset: Int! = 0): [Product!]!
    @join__field(graph: PRODUCTS)
}

type Review @join__type(graph: REVIEWS, key: "id") {
  id: ID!
  body: String!
  rating: Int!
  author: User! @join__field(graph: REVIEWS, provides: "username")
  product: Product!
}

type User
  @join__type(graph: ACCOUNTS, key: "id")
  @join__type(graph: REVIEWS, key: "id") {
  id: ID!
  name: String! @join__field(graph: ACCOUNTS)
  username: String!
    @join__field(graph: ACCOUNTS)
    @join__field(graph: REVIEWS, external: true)
  reviews: [Review!]! @join__field(graph: REVIEWS)
}
