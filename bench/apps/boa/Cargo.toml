# boa, the JavaScript engine, running the V8 benchmark suite on one thread. See ../README.md.
[workspace]
resolver = "3"

[package]
name = "app-boa"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[[bin]]
name = "boa"
path = "src/main.rs"

# The allocator under test, by the bench-alloc feature of its entry in ../../allocators.toml
# (none: glibc). Every program forwards the same set; see ../README.md.
[features]
mi = ["bench-alloc/mi"]
mi-sized = ["bench-alloc/mi-sized"]
mi-crate = ["bench-alloc/mi-crate"]
cralloc = ["bench-alloc/cralloc"]
je = ["bench-alloc/je"]
tc = ["bench-alloc/tc"]
sn = ["bench-alloc/sn"]

[dependencies]
bench-alloc = { path = "../../alloc" }
bench-app = { path = "../common" }
# The engine features the `boa` command (boa_cli 0.22.0) enables by default.
boa_engine = { version = "=0.22.0", features = [
  "annex-b",
  "deser",
  "experimental",
  "float16",
  "flowgraph",
  "intl_bundled",
  "native-backtrace",
  "temporal",
  "trace",
  "xsum",
] }

# boa's own release profile at 0.22, without `strip`, which changes no code.
[profile.release]
lto = "fat"
codegen-units = 1
