# The worst case of returning a zeroed block's pages instead of clearing them
# (docs/research/meili-peak.md): a workspace of its own, built from a scratch tree that
# proto_edit.py has edited (zbench.sh).
[workspace]

[package]
name = "zbench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
asmalloc = { path = "../../../../crates/asmalloc", features = ["executable"] }
libc = "0.2"

[profile.release]
codegen-units = 1
