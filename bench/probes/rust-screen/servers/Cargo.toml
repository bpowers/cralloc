[package]
name = "screen-servers"
version = "0.1.0"
edition = "2024"
publish = false
description = "Small services on real frameworks, and a RESP load client, for screening allocators"

[workspace]

[dependencies]
axum = "0.8.9"
actix-web = "4.17.0"
tokio = { version = "1.54.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
asmalloc = { path = "../../../../crates/asmalloc", features = ["executable", "background"], optional = true }
asmalloc-tokio = { path = "../../../../crates/asmalloc-tokio", optional = true }

[features]
# asmalloc as the global allocator, for measuring it without preloading; with it, the axum
# server's ORDERS_MAINTAIN picks how asmalloc's maintenance runs between bursts (see
# src/bin/axum-orders.rs).
asmalloc = ["dep:asmalloc", "dep:asmalloc-tokio"]

[profile.release]
debug = 1
