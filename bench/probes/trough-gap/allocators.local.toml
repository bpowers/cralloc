
# Local entries for bench/allocators.toml, appended for the server sessions of
# docs/research/trough-gap.md and removed afterwards (never committed there). The builds are
# bench/target/NAME of this checkout, made by build-orders.sh.
[[allocator]]
name = "tg-base"
feature = "asmalloc"
build = "o-base"
expect = { allocator = "asmalloc", library = "executable" }

[[allocator]]
name = "tg-r4"
feature = "asmalloc"
build = "o-r4"
expect = { allocator = "asmalloc", library = "executable" }

[[allocator]]
name = "tg-m256"
feature = "asmalloc"
build = "o-m256"
expect = { allocator = "asmalloc", library = "executable" }

[[allocator]]
name = "live-bytes"
feature = "live-bytes"
build = "live-bytes"
expect = { allocator = "asmalloc", library = "executable" }
