# Large blocks allocated whole and touched sparsely, densely or in a prefix, under the
# whole-block-huge switch (docs/research/whole-block-huge.md): a workspace of its own, built
# from a scratch tree that wbh_edit.py has edited (build.sh ... sparse).
[workspace]

[package]
name = "sparse"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
asmalloc = { path = "../../../../crates/asmalloc", features = ["executable"] }

[profile.release]
codegen-units = 1
