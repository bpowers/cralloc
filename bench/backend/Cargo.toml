[package]
name = "bench-backend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Launder and fill of asmalloc's back end on their own, against a heap of the benchmark's own
# (the process's global allocator stays glibc's).
[[bin]]
name = "backbench"
path = "src/main.rs"

# Fill and launder of one class from several threads at once.
[[bin]]
name = "backcontend"
path = "src/contend.rs"

[dependencies]
# `internals`: the back end itself is what this measures.
asmalloc = { path = "../../crates/asmalloc", features = ["internals"] }
bench-harness.workspace = true
