[package]
name = "bench-rpc"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true

# connect-rust's echo and log-ingest benchmarks (benches/rpc at c312bb9), as a server whose
# allocator comes from bench-alloc and a load generator. See README.md.
[[bin]]
name = "rpc-server"
path = "src/bin/server.rs"

[[bin]]
name = "rpc-client"
path = "src/bin/client.rs"

[features]
# With cralloc as the global allocator: BENCH_MAINTAIN=task runs its maintenance from a task
# on the server's runtime (cralloc-tokio), BENCH_MAINTAIN=thread from cralloc's background
# thread (src/bin/server.rs).
maintenance = ["dep:cralloc", "dep:cralloc-tokio"]

[dependencies]
cralloc = { path = "../../crates/cralloc", features = ["background"], optional = true }
cralloc-tokio = { path = "../../crates/cralloc-tokio", optional = true }
bench-alloc.workspace = true
bench-harness.workspace = true
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["server", "client", "json"] }
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
