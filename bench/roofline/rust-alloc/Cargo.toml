[package]
name = "roofline-rust-alloc"
version = "0.0.0"
edition = "2021"
publish = false

# Stands alone: not a member of any workspace above it.
[workspace]

# Pick at most one allocator; with none the binary uses the system allocator (glibc).
[features]
mi = []                 # mimalloc from MI_LIB_DIR, called as the `mimalloc` crate does
mi_sized = ["mi"]       # mimalloc with sized free
je = []                 # system libjemalloc, called as `tikv-jemallocator` does
floor_tls = []          # floor: free-list heads in thread-local statics
floor_heap = []         # floor: free-list heads behind a thread-local pointer
# A stand-in around the proved slab routines (src/slab.rs); the others refine `slab`.
slab = []               # inline pop and push, as generated
slab_direct = ["slab"]  # ... reading __rseq_offset with one rip-relative load
slab_call = ["slab"]    # ... the pop calls its slow path from inside the asm block
slab_nonnull = ["slab"] # ... and promises the compiler a non-null result
slab_ool = ["slab"]     # out-of-line routines, as generated
slab_pc = ["slab"]      # out of line, one entry per class
asm = ["dep:cralloc"]  # cralloc itself, reading __rseq_offset through the GOT
asm_exe = ["asm", "cralloc/executable"]  # ... reading it with one direct load

[dependencies]
cralloc = { path = "../../../crates/cralloc", optional = true }

[profile.release]
opt-level = 3
debug = 1
panic = "abort"

[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1
