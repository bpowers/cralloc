[package]
name = "roofline-rust-alloc"
version = "0.0.0"
edition = "2021"
publish = false

# Stands alone: not a member of any workspace above it.
[workspace]

# Pick at most one allocator; with none the binary uses the system allocator (glibc).
[features]
mi = []                 # mimalloc from MI_LIB_DIR, called as the `mimalloc` crate does
mi_sized = ["mi"]       # mimalloc with sized free
je = []                 # system libjemalloc, called as `tikv-jemallocator` does
floor_tls = []          # floor: free-list heads in thread-local statics
floor_heap = []         # floor: free-list heads behind a thread-local pointer

[profile.release]
opt-level = 3
debug = 1
panic = "abort"

[profile.lto]
inherits = "release"
lto = "fat"
codegen-units = 1
