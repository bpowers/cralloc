[package]
name = "centry-static"
version = "0.1.0"
edition = "2024"
publish = false

# Outside the workspace: a benchmark helper built only by ../build.sh.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
asmalloc = { path = "../../../../crates/asmalloc" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
