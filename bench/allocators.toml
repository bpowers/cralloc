# The allocators the runner compares. Adding one is one more entry here, plus, for native
# Rust runs, a cargo feature in alloc/ (see alloc/src/lib.rs).
#
# Each entry is what users of that allocator get: in native runs, the build its usual Rust
# crate makes; in preload runs, the shared library a C program would load.
#
#   name     label in results and reports
#   feature  bench-alloc cargo feature for native Rust builds; "" means Rust's System
#            allocator (glibc). Without it the allocator is not run natively.
#   preload  library for LD_PRELOAD runs; "" means none (glibc). "{baselines}/" is the
#            shared baselines directory (bench/baselines/out of the main checkout, or
#            BENCH_BASELINES); other relative paths are relative to this directory.
#            Without it the allocator is not run in preload mode.
#   env      environment for every run of this allocator
#   expect   what the process must report about itself; a run that disagrees is marked
#            invalid. `allocator` is the family, `mode` a mode the allocator picks at run
#            time, and `library` where a native run's allocator code must be: "executable"
#            when it is linked in, or a shared library's file name. A preload run must
#            always report the preloaded library itself. `version`, checked in native runs,
#            tells apart two builds of one allocator that differ in version.
#   preload_build  a package of the repository's root workspace that `benchrun build` builds
#            in release mode first, for a preload library that lives in this checkout
#   build    the native build directory under target/, for variants of one feature built by
#            hand with different allocator build-time knobs (ASMALLOC_<NAME>=...); benchrun
#            build leaves such entries alone
#   same_as  makes this entry a control: an exact copy of the named allocator under another
#            label, run as if it were a different allocator. Its results must match.

[[allocator]]
name = "glibc"
feature = ""
preload = ""
expect = { allocator = "glibc", library = "libc.so.6" }

# Native: third_party's mimalloc (the newest release, the harder bar), built as
# libmimalloc-sys builds its bundled copy and called as the `mimalloc` crate calls it.
[[allocator]]
name = "mimalloc"
feature = "mi"
preload = "{baselines}/mimalloc/libmimalloc.so"
expect = { allocator = "mimalloc", library = "executable", version = "30503" }

[[allocator]]
name = "mimalloc-sized"
feature = "mi-sized"
expect = { allocator = "mimalloc-sized", library = "executable", version = "30503" }

# The `mimalloc` crate exactly as a Rust program gets it, with the older mimalloc it bundles.
[[allocator]]
name = "mimalloc-crate"
feature = "mi-crate"
expect = { allocator = "mimalloc", library = "executable", version = "30302" }

# asmalloc as the global allocator, whose run-time check is that a fresh Box lies in its
# heap; and its LD_PRELOAD library from this checkout, which benchrun build builds.
[[allocator]]
name = "asmalloc"
feature = "asmalloc"
preload = "../target/release/libasmalloc_preload.so"
preload_build = "asmalloc-preload"
expect = { allocator = "asmalloc", library = "executable" }

# Native: tikv-jemallocator's own static build, as a Rust service gets it. Preload: the
# distribution's shared library.
[[allocator]]
name = "jemalloc"
feature = "je"
preload = "{baselines}/jemalloc/libjemalloc.so"
expect = { allocator = "jemalloc", library = "executable" }

# google/tcmalloc registers its own rseq area, which glibc 2.35 and later have already
# registered, so it silently runs with per-thread caches unless glibc's registration is
# turned off. Both modes are measured, and each run must report the mode it was in.
[[allocator]]
name = "tcmalloc-percpu"
feature = "tc"
preload = "{baselines}/tcmalloc/libtcmalloc.so"
env = { GLIBC_TUNABLES = "glibc.pthread.rseq=0" }
expect = { allocator = "tcmalloc", mode = "per-cpu", library = "executable" }

[[allocator]]
name = "tcmalloc-thread"
feature = "tc"
preload = "{baselines}/tcmalloc/libtcmalloc.so"
expect = { allocator = "tcmalloc", mode = "per-thread", library = "executable" }

[[allocator]]
name = "mimalloc-ctl"
same_as = "mimalloc"

[[allocator]]
name = "base"
feature = "asmalloc"
build = "asm-base"
preload = "/tmp/claude-1000/-home-bpowers-src-asmalloc/9350b66e-ff5f-4010-842a-f49ee9af0052/scratchpad/libs/base.so"
expect = { allocator = "asmalloc", library = "executable" }

