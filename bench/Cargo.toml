# Benchmark workspace. Not part of the root workspace, and not of the roofline harnesses,
# which are stand-alone projects. Cargo.lock is committed so every allocator's build of a
# workload compiles the same dependency versions.
[workspace]
resolver = "3"
members = ["alloc", "apps/common", "backend", "harness", "workloads", "rpc", "runner"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[workspace.dependencies]
bench-alloc = { path = "alloc" }
bench-harness = { path = "harness" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workloads are built the way the design recommends users build: fat LTO, one codegen
# unit. The baselines are C libraries and are never part of LTO; this only changes Rust.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"

# snmalloc-sys reads `debug` in its profile as asking for snmalloc's Debug configuration: no
# optimization, and its assertions. The default release profile, which sets no `debug`, gets Release.
[profile.release.package.snmalloc-sys]
debug = false
