[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR BSD-3-Clause"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The preload library is a no_std shared library, which cannot unwind (nor can the allocator
# serving a request). Tests and benchmarks ignore this and unwind as usual.
[profile.dev]
panic = "abort"

# What `scripts/gate --all` builds its tests with: optimized, because the explorations are mostly
# work the optimizer removes, and with every debug check on, because the tests are there to fail.
[profile.gate]
inherits = "dev"
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
incremental = true

# The allocator's fast paths only reach their callers through link-time optimization, so our
# own tests and benchmarks are built the way we recommend users build.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
