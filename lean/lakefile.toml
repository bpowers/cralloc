name = "Cralloc"
defaultTargets = ["Cralloc", "CrallocTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[lean_lib]]
name = "Cralloc"
# Every file under `Cralloc/`, not only those some root imports.
globs = ["Cralloc.+"]

# Golden tests of the trusted printers and the emitter's driver, and tests
# of the audits. Not modules: they evaluate code and run `#guard`.
[[lean_lib]]
name = "CrallocTest"
globs = ["CrallocTest.+"]
