name = "Asmalloc"
defaultTargets = ["Asmalloc", "AsmallocTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[lean_lib]]
name = "Asmalloc"
# Every file under `Asmalloc/`, not only those some root imports.
globs = ["Asmalloc.+"]

# Golden tests of the trusted printers and the emitter's driver, and tests
# of the audits. Not modules: they evaluate code and run `#guard`.
[[lean_lib]]
name = "AsmallocTest"
globs = ["AsmallocTest.+"]
