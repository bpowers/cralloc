# Every binary cargo runs for this workspace (tests, examples, benchmarks, `cargo run`) goes
# through a memory cap. An allocator under test that runs away must fail on its own; an
# uncapped test once took 57 GiB and the whole machine with it.
[target.x86_64-unknown-linux-gnu]
runner = "scripts/run-capped"

[target.x86_64-unknown-linux-musl]
runner = "scripts/run-capped"

# This machine's CPU is the baseline on aarch64: atomics are inline LSE instructions, with no
# run-time dispatch, and acquire loads can use RCpc. A program that builds the crate for the
# generic target still works; its slow paths call outlined atomics.
[target.aarch64-unknown-linux-gnu]
runner = "scripts/run-capped"
rustflags = ["-Ctarget-cpu=apple-m1"]

[target.aarch64-unknown-linux-musl]
runner = "scripts/run-capped"
rustflags = ["-Ctarget-cpu=apple-m1"]
