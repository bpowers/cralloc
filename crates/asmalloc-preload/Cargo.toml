[package]
name = "asmalloc-preload"
version = "0.1.0"
description = "asmalloc as an LD_PRELOAD library: the C allocation functions for any program"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# The library is no_std with its own panic handler, which a test harness cannot link. Its tests
# are in tests/, and run programs with the built library preloaded.
test = false
doctest = false

[dependencies]
# No features: `executable` cannot link into a shared library, and the C names are exported by
# `asmalloc::export_c_abi!` (see `asmalloc::c` for why not the `c-abi` feature).
asmalloc = { path = "../asmalloc" }

[lints]
workspace = true

[features]
# EXPERIMENT (domain-affine back end), not for merging: the allocator's counters, written to
# standard error at exit; and the allocator's experiment switches, passed through.
x-count = ["asmalloc/x-count"]
x-no-affinity = ["asmalloc/x-no-affinity"]
x-own-fill-first = ["asmalloc/x-own-fill-first"]
x-carve-own-first = ["asmalloc/x-carve-own-first"]
x-peek = ["asmalloc/x-peek"]
x-home = ["asmalloc/x-home"]
