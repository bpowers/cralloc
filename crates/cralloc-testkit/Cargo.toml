[package]
name = "cralloc-testkit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Shadow-model tester, mutant allocators and C-ABI conformance cases for cralloc"

[features]
# The `Allocator` trait is stable from Rust 1.100. Turn this on with a toolchain that has it
# (nightly today): it adds the `Allocator` adapter and its tests.
allocator-api = ["cralloc/allocator-api"]

[dependencies]
# `sim` brings the simulated heap the kit judges under Miri; `internals`, the simulated OS and
# the depot constants its drainer uses.
cralloc = { path = "../cralloc", features = ["sim", "internals"] }

[lints]
workspace = true
