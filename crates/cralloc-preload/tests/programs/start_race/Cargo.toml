# Many threads make the process heap's first allocation at once, and the program prints how
# many got null and the region size the heap ended with. Outside the workspace and run by hand,
# many launches under scripts/memlimit:
#
#   cargo build --release --manifest-path <this file> --target-dir <scratch>
#   for i in $(seq 300); do taskset -c 2-9 <scratch>/release/start-race 1000; done | sort | uniq -c
#   (and, for the null: MALLOC_ARENA_MAX=1 prlimit --as=$((10240 << 20)) -- ... start-race 64)
[package]
name = "start-race"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cralloc = { path = "../../../../cralloc" }

[workspace]
