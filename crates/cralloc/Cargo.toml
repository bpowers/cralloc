[package]
name = "cralloc"
version = "0.1.0"
description = "A memory allocator for multithreaded Rust programs on Linux"
edition.workspace = true
license.workspace = true
publish = false
# Lower than the 1.99 we develop and test on (README.md, "Limits worth knowing"), because the
# crate must also build on the nightly that Kani pins (1.93.0-nightly as of Kani 0.67). A
# pre-release compares below its release, so this says 1.92, which also keeps clippy from
# suggesting newer APIs.
rust-version = "1.92"

[features]
default = ["background"]
# The simulated OS (`os::sim`) for tests, fuzzing and proofs in other crates. It brings in the
# `alloc` crate; never enable it in a build that serves as the global allocator.
sim = ["internals"]
# Makes the components public (`back`, `classes`, `depot`, `front`, `os`, `space`) for the test
# kit, the fuzz targets and the benchmarks. Not part of the API: nothing outside this
# repository should enable it.
internals = []
# Read glibc's `__rseq_offset` with one load instead of two on the fast path. This links only
# into an executable (the linker gives it its own copy of the variable); a shared library that
# enables it fails to link. A musl build reads its own area's offset this way without it.
executable = []
# Export the C interface (`malloc`, `free` and the rest of `cralloc::c`) under its C names
# from this crate, so that a program linking it gets cralloc as its C allocator too. The
# preload library does not use this: it invokes `cralloc::export_c_abi!` itself, because cargo
# unifies features across a workspace and this one would also replace `malloc` in every test
# binary built alongside it.
c-abi = []
# The background thread (design: "The background thread"): it starts by default once the heap holds more
# than the floor of the allowance and the program has created a thread of its own, and parks
# while the process is quiet; `Cralloc::start_background` starts it at once. It is created with
# the C library's `pthread_create`, so the crate links the C library with it; a build for a
# program without one turns default features off.
background = []
# The `Allocator` trait for `Cralloc` (and `SimHeap`). The trait is stable from Rust 1.100, so
# until then this needs a nightly toolchain.
allocator-api = []

[[test]]
# Each case runs in a process of its own, made by the test binary itself (see the file).
name = "default_thread"
harness = false
# The cases are about the thread, which a build without the feature does not have.
required-features = ["background"]

[dependencies]

[lints]
workspace = true

[[test]]
name = "thread_stack"
harness = false
required-features = ["background"]

[[test]]
name = "environment"
# The switch is the background thread's.
required-features = ["background"]

[[test]]
name = "thread_start"
# The cases are about the thread, which a build without the feature does not have.
required-features = ["background"]
