[package]
name = "asmalloc"
version = "0.1.0"
description = "A memory allocator for multithreaded Rust programs on Linux"
edition.workspace = true
license.workspace = true
publish = false
# The crate must also build on the nightly that Kani pins (1.93.0-nightly as of Kani 0.67). A
# pre-release compares below its release, so this says 1.92, which also keeps clippy from
# suggesting newer APIs.
rust-version = "1.92"

[features]
# The simulated OS (`os::sim`) for tests, fuzzing and proofs in other crates. It brings in the
# `alloc` crate; never enable it in a build that serves as the global allocator.
sim = []
# Read glibc's `__rseq_offset` with one load instead of two on the fast path. This links only
# into an executable (the linker gives it its own copy of the variable); a shared library that
# enables it fails to link.
executable = []
# Export the C interface (`malloc`, `free` and the rest of `asmalloc::c`) under its C names
# from this crate, so that a program linking it gets asmalloc as its C allocator too. The
# preload library does not use this: it invokes `asmalloc::export_c_abi!` itself, because cargo
# unifies features across a workspace and this one would also replace `malloc` in every test
# binary built alongside it.
c-abi = []
# Export the C++ allocation operators (nothrow `operator new` and every `operator delete`)
# under their mangled names, as `asmalloc::export_cxx_abi!` does. Separate from `c-abi` because
# a C++ program may define these operators itself. Use it with `c-abi`: the throwing `new` forms
# stay the C++ runtime's, which allocates with `malloc`.
cxx-abi = []
# The `Allocator` trait for `Asmalloc` (and `SimHeap`). The trait is stable from Rust 1.100, so
# until then this needs a nightly toolchain.
allocator-api = []

[dependencies]

[lints]
workspace = true
