[package]
name = "asmalloc"
version = "0.1.0"
description = "A memory allocator for multithreaded Rust programs on Linux"
edition.workspace = true
license.workspace = true
publish = false
# The crate must also build on the nightly that Kani pins (1.93.0-nightly as of Kani 0.67). A
# pre-release compares below its release, so this says 1.92, which also keeps clippy from
# suggesting newer APIs.
rust-version = "1.92"

[features]
# The simulated OS (`os::sim`) for tests, fuzzing and proofs in other crates. It brings in the
# `alloc` crate; never enable it in a build that serves as the global allocator.
sim = ["internals"]
# Makes the components public (`back`, `classes`, `depot`, `front`, `os`, `space`) for the test
# kit, the fuzz targets and the benchmarks. Not part of the API: nothing outside this
# repository should enable it.
internals = []
# Read glibc's `__rseq_offset` with one load instead of two on the fast path. This links only
# into an executable (the linker gives it its own copy of the variable); a shared library that
# enables it fails to link. A musl build reads its own area's offset this way without it.
executable = []
# Export the C interface (`malloc`, `free` and the rest of `asmalloc::c`) under its C names
# from this crate, so that a program linking it gets asmalloc as its C allocator too. The
# preload library does not use this: it invokes `asmalloc::export_c_abi!` itself, because cargo
# unifies features across a workspace and this one would also replace `malloc` in every test
# binary built alongside it.
c-abi = []
# `Asmalloc::start_background`, which starts a thread that calls `Asmalloc::maintain` about
# twice a second, so that idle memory goes back to the OS even when no thread takes a slow path.
# It brings in `std`, for the thread; without it the crate is `no_std` and starts no thread.
# No crate of this workspace may enable it: cargo would unify it into the preload library's
# build, which is `no_std` with a panic handler of its own and cannot link `std`.
background = []
# The `Allocator` trait for `Asmalloc` (and `SimHeap`). The trait is stable from Rust 1.100, so
# until then this needs a nightly toolchain.
allocator-api = []
# EXPERIMENT (domain-affine back end), not for merging. `x-count` counts where fills and depot
# pops get their objects (`xcount`); `x-no-affinity` makes fills ignore the domain, as main's do;
# `x-own-fill-first` fills from the domain's own free slots before popping the shared stack.
x-count = []
x-no-affinity = []
x-own-fill-first = []
# `x-carve-own-first`: a fill carves in its own domain before it reuses another domain's free slots.
x-carve-own-first = []
# `x-peek` (with `x-own-fill-first`): pop the shared stack first when its top magazine is the domain's own.
x-peek = ["x-own-fill-first"]
# `x-home` (with `x-peek`): also pop it first when its top object lives in the domain's memory.
x-home = ["x-peek"]
# `x-cap-relax` (with `x-carve-own-first`): carve first only while retained memory is within the cap.
x-cap-relax = ["x-carve-own-first"]

[dependencies]

[lints]
workspace = true
